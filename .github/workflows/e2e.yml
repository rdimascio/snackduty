name: End-to-end

on:
  pull_request:
  push:
    branches:
      - main

permissions:
  contents: read

concurrency:
  group: e2e-${{ github.ref }}
  cancel-in-progress: true

jobs:
  e2e:
    name: Browser end-to-end suite
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
        with:
          persist-credentials: false

      - name: Set up Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.4.2

      - name: Install locked dependencies
        run: bun install --frozen-lockfile

      - name: Install Chromium for Playwright
        run: bunx playwright-core install --with-deps chromium

      - name: Run the end-to-end suite
        shell: bash
        run: bun run e2e 2>&1 | tee "$RUNNER_TEMP/e2e.log"

      - name: Upload traces and screenshots
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: e2e-failure-${{ github.run_id }}-${{ github.run_attempt }}
          include-hidden-files: true
          path: |
            ${{ runner.temp }}/e2e.log
            ${{ github.workspace }}/.artifacts/e2e/
          if-no-files-found: ignore
          retention-days: 7
